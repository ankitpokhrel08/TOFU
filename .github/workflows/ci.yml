name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Analysis and tests don't talk to Firebase; the template is enough.
      - run: cp lib/firebase_options.example.dart lib/firebase_options.dart
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Builds the APK with the maintainer's Firebase config, stored as
  # repository secrets. Skipped on forks and pull requests, which don't
  # have them.
  build-apk:
    name: Build release APK
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase config
        id: config
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "Firebase secrets not set; skipping the APK build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - if: steps.config.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - if: steps.config.outputs.ready == 'true'
        run: |
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk TOFU.apk

      - if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tofu-apk
          path: TOFU.apk
          retention-days: 14

      - name: Publish release
        if: steps.config.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TOFU.apk --title "TOFU $GITHUB_REF_NAME" --generate-notes
